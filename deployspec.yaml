version: 0.2

env:
  variables:
    AWS_REGION: 'us-east-1'
    CLUSTER_NAME: 'sre-copilot-cluster'
    ECR_REPO_NAME: 'vivah-bandh-frontend'
    DEPLOYMENT_NAME: 'vivahbandh-frontend'
    NAMESPACE: 'vivahbandh'

phases:
  install:
    commands:
      - echo "Installing kubectl..."
      - curl -LO "https://dl.k8s.io/release/v1.31.0/bin/linux/amd64/kubectl"
      - chmod +x kubectl
      - mv kubectl /usr/local/bin/kubectl

  pre_build:
    commands:
      - echo "Connecting to EKS cluster..."
      - aws eks update-kubeconfig --name $CLUSTER_NAME --region $AWS_REGION
      - ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - ECR_URI=$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPO_NAME
      - IMAGE_TAG=$(cat $CODEBUILD_SRC_DIR/image-tag.txt)
      - echo "Deploying image tag:" $IMAGE_TAG

  build:
    commands:
      - echo "Updating deployment..."
      - kubectl set image deployment/$DEPLOYMENT_NAME frontend=$ECR_URI:$IMAGE_TAG -n $NAMESPACE
      - kubectl rollout status deployment/$DEPLOYMENT_NAME -n $NAMESPACE --timeout=120s

  post_build:
    commands:
      - echo "Deployment complete. Live image:" $ECR_URI:$IMAGE_TAG
